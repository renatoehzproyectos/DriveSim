<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Orbit Drive - Cesium Sim</title>
    
    <!-- Cesium JS & CSS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <!-- Minimap Overlay -->
    <div id="minimap-container">
        <div id="minimap"></div>
        <div id="minimap-border"></div>
    </div>
    
    <!-- UI Overlays -->
    <div id="ui-layer">
        <!-- Camera + quality controls (top-left) -->
        <div id="left-controls">
            <div class="slider-group">
                <label for="cam-height-slider">CAM</label>
                <input type="range" id="cam-height-slider" min="3" max="80" step="1" value="8">
                <span id="cam-height-value">8 m</span>
            </div>
            <div class="slider-group">
                <label for="map-quality-slider">MAP</label>
                <input type="range" id="map-quality-slider" min="1" max="19" step="1" value="18">
                <span id="map-quality-value">HI</span>
            </div>
            <div class="slider-group">
                <label for="render-dist-slider">FAR</label>
                <input type="range" id="render-dist-slider" min="1" max="16" step="1" value="2">
                <span id="render-dist-value">HI</span>
            </div>
        </div>

        <div id="speedometer">
            <span id="speed-value">0</span>
            <span id="speed-unit">KM/H</span>
        </div>
        
        <!-- Destination Search / Teleport -->
        <div id="search-container">
            <input type="text" id="dest-input" placeholder="Address, city or lat, lon" autocomplete="off" enterkeyhint="go">
            <div id="search-buttons">
                <button id="route-btn" title="Create driving route">ROUTE</button>
                <button id="teleport-btn" title="Instantly jump there">TELEPORT</button>
            </div>
            <div id="gps-buttons">
                <button id="gps-toggle-btn" title="Track your real GPS position with ultra accuracy">GPS ON</button>
                <button id="gps-teleport-btn" title="Teleport car next to you" disabled>TO ME</button>
            </div>
            <div id="gps-status" class="hidden">
                <span id="gps-accuracy">—</span>
            </div>
        </div>
        
        <div id="nav-instructions" class="hidden">
            <p id="nav-text">Drive to start...</p>
        </div>
    </div>
    
    <!-- Mobile Controls -->
    <div id="controls-layer">
        <div id="steering-container">
            <div id="steering-wheel">
                <div class="wheel-spoke"></div>
                <div class="wheel-spoke"></div>
                <div class="wheel-center"></div>
            </div>
        </div>
        
        <div id="pedals-container">
            <div id="brake-pedal" class="pedal">BRAKE</div>
            <div id="gas-pedal" class="pedal">GAS</div>
        </div>
    </div>

    <!-- App Logic -->
    <script src="js/vehicle.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
